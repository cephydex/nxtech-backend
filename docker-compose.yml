# version: '3'
services:
  nxtech-app:
    container_name: nxtech-be
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8010:80'
    volumes:
      - .:/app

  nxtech-db:
    container_name: nxtech-db
    image: postgres:14-alpine
    restart: always
    env_file:
      - ./config/postgres.env
    ports:
      - "8012:5432"
    # healthcheck:
    #   test: [ "CMD-SHELL", "pg_isready -d postgres" ]
    #   interval: 120s
    #   timeout: 10s
    #   retries: 5
    # volumes:
    #   - ./db:/docker-entrypoint-initdb.d
    #   - data:/var/lib/postgresql/data/

  nxtech-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nxtech-pgadmin
    restart: unless-stopped
    ports:
      - "8013:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: admin@password
    depends_on:
      - nxtech-db
    logging:
      driver: none
